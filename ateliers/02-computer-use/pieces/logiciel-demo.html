<!doctype html><html lang='fr'><meta charset='utf-8'><title>Logiciel fictif de réservation</title><style>body{font:16px system-ui;max-width:700px;margin:40px auto;background:#edf4f6;padding:24px}label{display:block;margin:12px 0}input,select{width:100%;padding:10px}button{padding:12px;background:#14324a;color:white;border:0;border-radius:7px}</style><h1>Réservations — démonstration</h1><p>Ne transmet aucune donnée. Le bouton prépare seulement une prévisualisation.</p><form id='f'><label>Identifiant<input required name='id'></label><label>Matériel<select name='materiel'><option>Vidéoprojecteur A</option><option>Enceinte mobile</option><option>Micro mobile</option><option>Ordinateur portable 2</option><option>Caméra mobile</option><option>Tablette 3</option></select></label><label>Date<input required type='date' name='date'></label><label>Début<input required type='time' name='debut'></label><label>Fin<input required type='time' name='fin'></label><button>Prévisualiser, sans enregistrer</button></form><pre id='o'></pre><script>document.querySelector('#f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);document.querySelector('#o').textContent=JSON.stringify(Object.fromEntries(f),null,2)+'\\nNON ENREGISTRÉ'}</script></html>
